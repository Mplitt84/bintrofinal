[build]
  # Unit tests gate every deploy: a failing test stops the release. The database is
  # unset for the tests so the integration tests skip and never touch live data;
  # those run in GitHub Actions (.github/workflows/tests.yml) against a throwaway database.
  command = "npm run build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), microphone=(self), bluetooth=(self), geolocation=()"
